<meta property="og:description" content="Request a photography session with Jaxon G Photography. Sports, portrait, event, commercial, and wedding inquiries welcome.">

<meta property="og:image" content="https://jaxongphotography.com/assets/images/og-cover.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="favicon.svg" type="image/svg+xml">

<body data-page="contact">
<main id="main">
  <header class="wrap page-head">
    <h1 class="display d-xxl">Book a session</h1>
    <p class="lede muted" style="margin-top:1.5rem">Tell me about your shoot. I'll reply by email with availability and next steps.</p>
  </header>
  <div class="wrap section contact" style="padding-top:0">
    <div id="form-box">
      <div id="setup-note"></div>
      <form id="inquiry" novalidate>
        <p class="pkg-note" id="pkg-note" hidden></p>
        <div class="field"><label for="f-name">Your name</label><input id="f-name" name="name" type="text" autocomplete="name" required aria-describedby="e-name"><p class="err" id="e-name"></p></div>
        <div class="field"><label for="f-email">Email address</label><input id="f-email" name="email" type="email" autocomplete="email" required aria-describedby="e-email"><p class="err" id="e-email"></p></div>
        <div class="field"><label for="f-phone">Phone number <span class="opt">(optional)</span></label><input id="f-phone" name="phone" type="tel" autocomplete="tel" aria-describedby="e-phone"><p class="err" id="e-phone"></p></div>
        <div class="field"><label for="f-service">Photography service</label><select id="f-service" name="service" required aria-describedby="e-service"><option value="">Choose a service</option></select><p class="err" id="e-service"></p></div>
        <div class="row2">
          <div class="field"><label for="f-date">Preferred date <span class="opt">(optional)</span></label><input id="f-date" name="date" type="date" aria-describedby="e-date"><p class="err" id="e-date"></p></div>
          <div class="field"><label for="f-location">Location <span class="opt">(optional)</span></label><input id="f-location" name="location" type="text" placeholder="City, venue, or field"></div>
        </div>
        <div class="field"><label for="f-details">Additional details <span class="opt">(optional)</span></label><textarea id="f-details" name="details" rows="5"></textarea></div>
        <input type="hidden" name="package" id="f-package">
        <input type="hidden" name="_subject" value="New booking inquiry from jaxongphotography.com">
        <div class="hp" aria-hidden="true"><label>Leave this empty<input type="text" name="_gotcha" tabindex="-1" autocomplete="off"></label></div>
        <button class="btn btn-red" type="submit" id="send">Send inquiry</button>
        <div id="status" role="status" aria-live="polite"></div>
      </form>
    </div>
    <aside class="direct" id="direct" aria-labelledby="direct-title"></aside>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
<script src="js/form.js"></script>
</body>
</html>
